[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "val54-adapter-extension"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["arch-explorer==0.2.0"]
description = "Test-only adapter boundary fixture; no hardware cost model"
license = {text = "Apache-2.0"}

[project.entry-points."arch_explorer.components"]
val54 = "val54_adapter_extension:register"

[tool.setuptools.packages.find]
where = ["src"]
