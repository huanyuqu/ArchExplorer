name: Python package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,mcp]'
      - run: python -m pytest -q
      - run: archexplorer search --config examples/reusable_detail/demand.json --output demo.json
      - run: archexplorer evaluate demo.json
      - run: python -m build
