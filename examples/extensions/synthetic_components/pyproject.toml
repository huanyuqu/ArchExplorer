[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archexplorer-synthetic-components"
version = "0.1.0"
description = "Synthetic component and provider authoring example for ArchExplorer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["arch-explorer>=0.2.0"]

[project.entry-points."arch_explorer.components"]
tutorial = "ae_synthetic:register"

[tool.setuptools.packages.find]
where = ["src"]
