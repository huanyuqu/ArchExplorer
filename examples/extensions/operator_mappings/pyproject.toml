[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archexplorer-operator-mappings"
version = "0.1.0"
description = "Independent square semantics and a registered materialized mapping for ArchExplorer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["arch-explorer>=0.2.0"]

[project.entry-points."arch_explorer.components"]
operator_mappings = "ae_operator_mappings:register"

[tool.setuptools.packages.find]
where = ["src"]
