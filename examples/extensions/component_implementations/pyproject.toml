[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archexplorer-component-implementations"
version = "0.3.0"
description = "External SM implementations and a component-bound task adapter for ArchExplorer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["arch-explorer>=0.2.0"]

[project.entry-points."arch_explorer.components"]
serial_sm = "ae_component_implementations:register"

[tool.setuptools.packages.find]
where = ["src"]
